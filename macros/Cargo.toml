[package]
name = "rod-macros"
version = "0.1.1"
edition = "2021"
description = "Procedural macros for the Rod validation library"
license = "MIT"
repository = "https://github.com/AxiomCore/rod"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"