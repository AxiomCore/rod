[package]
name = "rod-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for the Rod validation library"

[lib]
crate-type = ["cdylib"]

[dependencies]
rod = { path = "../../core", features = ["non-thread-safe"] }

js-sys = "0.3"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"