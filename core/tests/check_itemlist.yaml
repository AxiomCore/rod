type: object
properties:
  items:
    type: array
    max: 100000
    items:
      type: object
      properties:
        id: {type: string, min: 1, max: 64}
        name: {type: string, min: 1, max: 200}
        price: {type: number, min: 0}
        qty: {type: number, int: true, min: 0, max: 1000}
        active: {type: boolean}
        tags:
          type: array
          max: 20
          items: {type: string, min: 1, max: 32}
  total: {type: number, int: true, min: 0}
